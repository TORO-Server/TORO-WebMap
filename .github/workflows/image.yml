name: image

# このリポジトリを変えたら型と試験を確かめ、main へのプッシュで GHCR (ghcr.io/<owner>/toro-webmap) にイメージを置く。
# 本番が使うのは、タグ v* から作る版 (docker-compose.yaml で固定)。プルリクエストは試験とビルドだけ (置かない)。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 型と試験 (Dockerfile の test 段)。Node を runner に入れずに済ませる
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=webmap
          cache-to: type=gha,mode=max,scope=webmap

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # GHCR の名前は小文字だけ
          images: ghcr.io/${{ github.repository_owner }}/toro-webmap
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=match,pattern=v(.*),group=1

      # 置く前に、本番と同じ縛り (非 root、読み取り専用、capability なし) で起動して答えること (DB が無くても画面は返す)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/toro-webmap:ci
          cache-from: type=gha,scope=webmap

      - name: 起動の確かめと大きさ
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:13000:3000 local/toro-webmap:ci
          ok=false
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:13000/; then ok=true; break; fi
            sleep 1
          done
          docker exec smoke wget -q -O /dev/null http://127.0.0.1:3000/ || ok=false
          docker logs --tail 20 smoke
          docker rm -f smoke
          test "$ok" = true
          size=$(docker image inspect local/toro-webmap:ci --format '{{.Size}}')
          echo "toro-webmap: $((size / 1048576)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=webmap
          cache-to: type=gha,mode=max,scope=webmap
